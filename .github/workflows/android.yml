# Build NASKTV TV Android APKs (arm64-v8a 64-bit / armeabi-v7a 32-bit) — NO signing
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Outputs are unsigned debug/sideload APKs (no release keystore).

name: Build TV Android

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # tauriTarget：传给 `tauri android build --target` 的简化名（aarch64/armv7/i686/x86_64）
          # rustTarget：Rust 交叉编译目标三元组，供 dtolnay/rust-toolchain 安装
          - tauriTarget: aarch64
            rustTarget: aarch64-linux-android
            arch: arm64-v8a
          - tauriTarget: armv7
            rustTarget: armv7-linux-androideabi
            arch: armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager（pnpm@9.0.0，与 lockfileVersion 9.0 一致）单一来源决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK + build-tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.1.10909125" "platforms;android-36" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # 有 tag 用 tag 版本（精确匹配 Release），无 tag 从 manifest 同步
          # （release-please 每次 Release PR 合并后 manifest 已 bump 并提交到 main）
          if [ -n "$TAG" ]; then
            node scripts/set-version.mjs "${TAG#v}"
          else
            node scripts/set-version.mjs
          fi

      # 为 release APK 生成 debug keystore（~/.android/debug.keystore）。
      # gradle 的 release buildType 已配置 signingConfig = debug（见 build.gradle.kts），
      # 自动引用此 keystore。必须在 Build APK 前生成，否则 gradle 签名步骤可能因文件不存在失败。
      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NASKTV CI, O=NASKTV, C=CN"
          fi
          echo "✅ debug keystore ready: $(ls -la ~/.android/debug.keystore)"

      - name: Build APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          CARGO_NDK_VERSION: 26
        run: |
          cd packages/tv-app
          pnpm exec tauri android build --target ${{ matrix.tauriTarget }} --apk

      - name: Prepare APK
        run: |
          # gradle 签名后产出 app-release.apk（不再是 *-unsigned.apk）。
          APK=$(find packages/tv-app/src-tauri/gen/android -name '*-release.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::未找到签名后的 release APK (gen/android/.../build/outputs/apk/release/*.apk)"
            exit 1
          fi
          cp "$APK" "nasktv-tv-${{ matrix.arch }}.apk"
          echo "✅ prepared: $(ls -la nasktv-tv-${{ matrix.arch }}.apk)"

      - name: Upload to Release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "nasktv-tv-${{ matrix.arch }}.apk" --clobber --repo "${{ github.repository }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-android-${{ matrix.arch }}
          path: nasktv-tv-${{ matrix.arch }}.apk
          if-no-files-found: warn
